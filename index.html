<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3a2d">
<title>Home Workout Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* layout: one phone-width column; deep-green hero, marigold actions, bottom tab bar; colour-flooded workout player */
:root {
  --bg: #eef2eb;
  --surface: #ffffff;
  --sunk: #e0e8dd;
  --ink: #10211a;
  --muted: #56685e;
  --line: #d2dccf;
  --accent: #f4a40e;
  --on-accent: #1e1604;
  --accent-ink: #9b5c00;
  --hero: #0f3a2d;
  --hero-2: #185240;
  --on-hero: #eef4ee;
  --rest: #0f6b57;
  --on-rest: #ffffff;
  --cardio: #3243a6;
  --on-cardio: #ffffff;
  --good: #1d8656;
  --warn: #9a5f0a;
  --floor: #e5ebe2;
  --mat: #9fd3c3;
  --prop: #84908a;
  --prop-2: #c1cbc4;
  --prop-fill: #cad3cc;
  --skin: #c98a5e;
  --skin-far: #a06a45;
  --skin-d: #ae7149;
  --hair: #221b17;
  --shirt: #2f5fcf;
  --shirt-far: #23489d;
  --shorts: #23302b;
  --shorts-far: #46554e;
  --sock: #f4f5f2;
  --sock-far: #c9cdc9;
  --shoe: #fbfbf9;
  --shoe-far: #cfd3cf;
  --font-d: "Big Shoulders Display", "Barlow Condensed", "Roboto Condensed", "sans-serif-condensed", "Arial Narrow", sans-serif;
  --font-b: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08130f; --surface: #10201a; --sunk: #183026; --ink: #e8f1eb; --muted: #8fa69a; --line: #21392f;
    --accent: #ffb732; --on-accent: #1e1604; --accent-ink: #ffc75e; --hero: #133a2d; --hero-2: #1b4c3b; --on-hero: #e8f1eb;
    --rest: #33b08e; --on-rest: #04120d; --cardio: #8e9cff; --on-cardio: #0a0e2a; --good: #52cf8f; --warn: #f2b14b;
    --floor: #183026; --mat: #2a6a5a; --prop: #7d8c84; --prop-2: #3d5047; --prop-fill: #334a40;
    --skin: #c98a5e; --skin-far: #93603e; --skin-d: #ae7149; --hair: #120e0c; --shirt: #4a7cf0; --shirt-far: #3459b0; --shorts: #56665e; --shorts-far: #3a4842; --sock: #eef0ec; --sock-far: #a7aca8; --shoe: #f2f3f0; --shoe-far: #a9aea9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08130f; --surface: #10201a; --sunk: #183026; --ink: #e8f1eb; --muted: #8fa69a; --line: #21392f;
  --accent: #ffb732; --on-accent: #1e1604; --accent-ink: #ffc75e; --hero: #133a2d; --hero-2: #1b4c3b; --on-hero: #e8f1eb;
  --rest: #33b08e; --on-rest: #04120d; --cardio: #8e9cff; --on-cardio: #0a0e2a; --good: #52cf8f; --warn: #f2b14b;
  --floor: #183026; --mat: #2a6a5a; --prop: #7d8c84; --prop-2: #3d5047; --prop-fill: #334a40;
  --skin: #c98a5e; --skin-far: #93603e; --skin-d: #ae7149; --hair: #120e0c; --shirt: #4a7cf0; --shirt-far: #3459b0; --shorts: #56665e; --shorts-far: #3a4842; --sock: #eef0ec; --sock-far: #a7aca8; --shoe: #f2f3f0; --shoe-far: #a9aea9;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-b); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }

#app { max-width: 520px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; background: var(--bg); }
main { flex: 1; overflow-y: auto; padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 18px; }
main > *, .sheet > *, .pwrap > * { flex-shrink: 0; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabs button { background: none; border: 0; padding: 8px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--accent-ink); font-weight: 700; }
.tabs button[aria-current="page"] svg { stroke-width: 2.4; }

/* type */
.eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.display { font-family: var(--font-d); font-weight: 800; font-size: 44px; line-height: .95; letter-spacing: .005em; text-transform: uppercase; }
.h2 { font-family: var(--font-d); font-weight: 800; font-size: 26px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; }
.small { font-size: 14px; color: var(--muted); }
.muted { color: var(--muted); }

/* cards and rows */
.card { background: var(--surface); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card.flat { background: transparent; padding: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-d); font-size: 32px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }

.btn { border: 0; border-radius: 12px; padding: 12px 16px; background: var(--sunk); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.big { width: 100%; min-height: 62px; font-family: var(--font-d); font-size: 28px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; border-radius: 16px; }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn svg { width: 20px; height: 20px; }
.iconbtn { border: 0; background: var(--sunk); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 14.5px; font-weight: 700; color: var(--ink); min-height: 38px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll .chip { flex: none; }
.tag { font-size: 12.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--sunk); color: var(--muted); }
.tag.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.tag.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.tag.acc { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent-ink); }

.banner { border-left: 4px solid var(--accent); background: var(--surface); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }

/* exercise list */
.block { display: flex; flex-direction: column; gap: 6px; }
.blockhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 4px 2px; }
.blockhead .small { text-align: right; }
.blockhead .h2 { font-size: 22px; }
.exlist { background: var(--surface); border-radius: 14px; overflow: hidden; }
.exrow { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 8px; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.exrow:last-child { border-bottom: 0; }
.exrow .th { width: 76px; height: 54px; flex: none; border-radius: 9px; background: var(--floor); overflow: hidden; }
.exrow .th svg { width: 100%; height: 100%; display: block; }
.exrow .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.exrow .tx b { font-weight: 700; line-height: 1.2; }
.exrow .tx span { font-size: 13.5px; color: var(--muted); }
.exmain { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: left; }

/* figure styling */
svg.fig { display: block; width: 100%; height: auto; }
.fig .flimb { stroke: var(--fig); stroke-width: 6.2; }
.fig .far .flimb { stroke: var(--fig-far); }
.fig .ftorso { stroke: var(--fig); stroke-width: 10; }
.fig .fhead { fill: var(--fig); }
.fig .feye { fill: var(--surface); }
.fig .sk { fill: var(--skin); }
.fig .far .sk { fill: var(--skin-far); }
.fig .skd { fill: var(--skin-d); }
.fig .sh { fill: var(--shirt); }
.fig .far .sh { fill: var(--shirt-far); }
.fig .so { fill: var(--shorts); }
.fig .far .so { fill: var(--shorts-far); }
.fig .wh { fill: var(--sock); }
.fig .far .wh { fill: var(--sock-far); }
.fig .shoe { fill: var(--shoe); stroke: var(--prop-2); stroke-width: .6; }
.fig .far .shoe { fill: var(--shoe-far); }
.fig .sole { stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; fill: none; }
.fig .hair { fill: var(--hair); }
.fig .eye { fill: #1c1612; }
.fig .ffloor { fill: var(--floor); }
.fig .fground { stroke: var(--prop-2); stroke-width: 1; }
.fig .fshadow { fill: var(--ink); opacity: .07; }
.fig .pf { fill: var(--prop-fill); }
.fig .pf2 { fill: var(--prop-2); }
.fig .ps { stroke: var(--prop); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fig .ps2 { stroke: var(--prop-2); fill: none; stroke-linecap: round; }
.fig .pring { fill: none; stroke: var(--prop); }
.fig .pmat { fill: var(--mat); }
.fig .pw { fill: var(--accent); }
.fig .pw2 { fill: color-mix(in srgb, var(--accent) 45%, var(--surface)); }
.fig .pwc { fill: var(--surface); }
.fig .pwl { stroke: var(--accent); fill: none; }
.fig .pband, .fig .prope { stroke: var(--accent); fill: none; stroke-linecap: round; }
.fig .pd { stroke: var(--prop-2); stroke-linecap: round; }
.thumb .flimb { stroke-width: 7; }

/* week strip / rings */
.weekstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 700; }
.wd i { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-style: normal; font-size: 13px; color: var(--ink); }
.wd.plan i { border-color: var(--ink); }
.wd.done i { background: var(--good); border-color: var(--good); color: #fff; }
.wd.today { color: var(--accent); }
.wd.today i { border-color: var(--accent); border-width: 3px; }
.ring { width: 64px; height: 64px; flex: none; }
.ring circle { fill: none; stroke-width: 7; }
.ring .bgc { stroke: var(--sunk); }
.ring .fgc { stroke: var(--good); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lbl { font-weight: 700; font-size: 15px; }
.field .hint { font-size: 13.5px; color: var(--muted); }
.inp { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-height: 46px; width: 100%; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.err { color: var(--accent); font-size: 14px; font-weight: 700; }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
legend { font-weight: 700; font-size: 15px; padding: 0; margin-bottom: 6px; }

/* sheets & dialogs */
.scrim { position: fixed; inset: 0; background: rgba(8, 10, 12, .5); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 520px; max-height: 92%; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 14px 16px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
.sheet .stagebox { background: var(--floor); border-radius: 14px; overflow: hidden; }
.dialog { margin: auto 16px; background: var(--surface); border-radius: 16px; padding: 18px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 12px; align-self: center; }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }

/* player */
.player { --pbg: var(--accent); position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; background: var(--pbg); color: var(--on-accent); transition: background-color .35s; }
.player.rest, .player.prep, .player.tr { --pbg: var(--rest); color: var(--on-rest); }
.player.steady { --pbg: var(--cardio); color: var(--on-cardio); }
.player.done { --pbg: var(--bg); color: var(--ink); }
.pwrap { max-width: 520px; width: 100%; margin: 0 auto; height: 100%; display: flex; flex-direction: column; padding: 10px 16px 0; gap: 8px; overflow-y: auto; }
.ptop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ptop .iconbtn { background: color-mix(in srgb, currentColor 14%, transparent); color: inherit; }
.player.done .ptop .iconbtn { background: var(--sunk); }
.pphase { font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; text-align: center; flex: 1; }
.pstage { background: var(--surface); border-radius: 18px; overflow: hidden; position: relative; flex: none; }
.pstage .fig .sk { fill: var(--skin); }
.fig .far .sk { fill: var(--skin-far); }
.fig .skd { fill: var(--skin-d); }
.fig .sh { fill: var(--shirt); }
.fig .far .sh { fill: var(--shirt-far); }
.fig .so { fill: var(--shorts); }
.fig .far .so { fill: var(--shorts-far); }
.fig .wh { fill: var(--sock); }
.fig .far .wh { fill: var(--sock-far); }
.fig .shoe { fill: var(--shoe); stroke: var(--prop-2); stroke-width: .6; }
.fig .far .shoe { fill: var(--shoe-far); }
.fig .sole { stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; fill: none; }
.fig .hair { fill: var(--hair); }
.fig .eye { fill: #1c1612; }
.fig .ffloor { fill: var(--floor); }
.pstage .badge { position: absolute; top: 10px; left: 10px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 13px; border-radius: 8px; padding: 3px 8px; }
.ptitle { font-family: var(--font-d); font-weight: 800; font-size: 40px; line-height: .95; text-transform: uppercase; text-wrap: balance; }
.psub { font-weight: 700; font-size: 17px; opacity: .92; min-height: 1.4em; }
.ptime { font-family: var(--font-d); font-weight: 800; font-size: 96px; line-height: .85; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.pbar { height: 8px; border-radius: 4px; background: color-mix(in srgb, currentColor 22%, transparent); overflow: hidden; }
.pbar i { display: block; height: 100%; background: currentColor; width: 0; }
.pnext { display: flex; align-items: center; gap: 10px; font-size: 15px; background: color-mix(in srgb, currentColor 12%, transparent); border-radius: 12px; padding: 6px 10px 6px 6px; }
.pnext .th { width: 58px; height: 41px; border-radius: 8px; background: var(--surface); overflow: hidden; flex: none; }
.pnext .th svg { width: 100%; height: 100%; }
.pctl { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 10px; margin-top: auto; position: sticky; bottom: 0; padding: 8px 0 calc(14px + env(safe-area-inset-bottom)); background: inherit; }
.player .pctl { background: var(--pbg); }
.segs div[hidden] { display: none; }
.pstage svg { max-height: 34vh; }
.player details > summary::before { color: inherit; }
.pctl button { border: 0; border-radius: 16px; min-height: 64px; background: color-mix(in srgb, currentColor 14%, transparent); color: inherit; display: grid; place-items: center; font-weight: 700; }
.pctl button.main { background: var(--surface); color: var(--ink); }
.pctl svg { width: 30px; height: 30px; }
.pmini { display: flex; gap: 8px; }
.pmini button { flex: 1; border: 0; border-radius: 12px; min-height: 42px; background: color-mix(in srgb, currentColor 14%, transparent); color: inherit; font-weight: 700; font-size: 14.5px; }
.segs { display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.segs div { display: flex; justify-content: space-between; padding: 6px 10px; border-radius: 9px; background: color-mix(in srgb, currentColor 12%, transparent); }
.segs div.on { background: var(--surface); color: var(--ink); font-weight: 700; }
.segs div.past { opacity: .55; text-decoration: line-through; }
.pnote { font-size: 14px; opacity: .9; }
.player .howbox { background: color-mix(in srgb, currentColor 12%, transparent); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
.player.done .pwrap { overflow-y: auto; }

/* chart */
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .ar { fill: var(--accent); opacity: .12; }
.chart .tg { stroke: var(--good); stroke-width: 2; stroke-dasharray: 5 5; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-b); }
.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }

.hist { display: flex; flex-direction: column; }
.hist div { display: flex; justify-content: space-between; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 15px; }
.hist div:last-child { border-bottom: 0; }

details > summary { cursor: pointer; font-weight: 700; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+ "; color: var(--accent); }
details[open] > summary::before { content: "\2013  "; }

@media (prefers-reduced-motion: reduce) { .player { transition: none; } }
@media (max-width: 360px) { .display { font-size: 38px; } .ptime { font-size: 80px; } .ptitle { font-size: 34px; } }
@media (max-height: 700px) { .ptime { font-size: 72px; } .ptitle { font-size: 32px; } .pctl button { min-height: 54px; } }

/* hero card (today) */
.hero { background: var(--hero); color: var(--on-hero); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 30%, transparent), transparent 70%); pointer-events: none; }
.hero .eyebrow { color: color-mix(in srgb, var(--on-hero) 70%, transparent); }
.hero .display { color: var(--accent); }
.hero .stat { background: color-mix(in srgb, var(--on-hero) 9%, transparent); }
.hero .stat span { color: color-mix(in srgb, var(--on-hero) 72%, transparent); }
.hero .tag.good { background: color-mix(in srgb, var(--good) 30%, transparent); color: var(--on-hero); }
.hero .tag.acc { color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }

/* camera angle switch */
.seg { display: inline-flex; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 6px 10px; font-size: 13.5px; font-weight: 700; color: var(--muted); min-height: 32px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.pcam { margin-top: -2px; }
.pcam .seg { background: color-mix(in srgb, currentColor 14%, transparent); }
.pcam .seg button { color: inherit; opacity: .85; }
.pcam .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); opacity: 1; }

/* welcome + sign-in */
.gate { position: fixed; inset: 0; z-index: 50; background: var(--hero); color: var(--on-hero); overflow-y: auto; }
.gwrap { max-width: 520px; margin: 0 auto; min-height: 100%; padding: 18px 20px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
.gstage { background: var(--surface); border-radius: 22px; overflow: hidden; }
.gstage svg { max-height: 36vh; }
.gtitle { font-family: var(--font-d); font-weight: 800; font-size: 60px; line-height: .86; text-transform: uppercase; color: var(--accent); letter-spacing: .005em; margin: 0; }
.gpoints { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 16.5px; }
.gpoints li { display: flex; gap: 10px; align-items: flex-start; }
.gpoints li::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--accent); margin-top: 7px; }
.gate .btn { min-height: 52px; font-size: 17px; }
.gate .btn.light { background: var(--on-hero); color: var(--hero); }
.gate .btn.ghost { border-color: color-mix(in srgb, var(--on-hero) 35%, transparent); color: var(--on-hero); }
.gate .inp { background: color-mix(in srgb, var(--on-hero) 8%, transparent); border-color: color-mix(in srgb, var(--on-hero) 25%, transparent); color: var(--on-hero); }
.gate .inp::placeholder { color: color-mix(in srgb, var(--on-hero) 55%, transparent); }
.gate .small, .gate .note { color: color-mix(in srgb, var(--on-hero) 75%, transparent); font-size: 14px; }
.gate .err { color: var(--accent); }
.gate .or { display: flex; align-items: center; gap: 10px; font-size: 13px; color: color-mix(in srgb, var(--on-hero) 60%, transparent); }
.gate .or::before, .gate .or::after { content: ""; flex: 1; height: 1px; background: color-mix(in srgb, var(--on-hero) 25%, transparent); }
.gate .linkbtn { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 6px 0; text-align: left; }
.acct { display: flex; align-items: center; gap: 10px; }
.acct .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--good); flex: none; }
.acct .dot.off { background: var(--warn); }
.gate.auth .gstage { display: none; }
.gate.auth .gtitle { font-size: 40px; }

</style>
</head>
<body>
<div id="app"></div>
<script>window.HWC_HOSTED = true;</script>
<script src="config.js"></script>
<script>
// ===== Figure engine: 2D skeleton, forward + inverse kinematics, SVG renderer =====
const FIG = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  // segment lengths (world units, standing figure ~100 tall)
  const L = { T1: 17, T2: 17, SH: 14, NK: 10, HR: 7, UA: 17, FA: 16, TH: 24, SN: 23, FT: 8, WS: 8, WH: 5 };
  const RAD = Math.PI / 180;
  const dir = a => [Math.cos(a * RAD), Math.sin(a * RAD)];
  const mv = (p, a, l) => [p[0] + Math.cos(a * RAD) * l, p[1] + Math.sin(a * RAD) * l];
  const lerp = (a, b, u) => a + (b - a) * u;
  const lerpA = (a, b, u) => a + ((((b - a) % 360) + 540) % 360 - 180) * u;
  const lerpV = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];
  const ease = u => u * u * (3 - 2 * u);
  const LIMBS = ['a', 'A', 'l', 'L'];
  const DEF = { hip: [0, 50], t: 90, t2: 90, h: 90, lift: 0, a: [-97, -90], A: [-84, -80], l: [-91, -91], L: [-89, -89] };

  function ik(root, tg, l1, l2, bend) {
    const dx = tg[0] - root[0], dy = tg[1] - root[1];
    let d = Math.hypot(dx, dy);
    d = Math.min(Math.max(d, Math.abs(l1 - l2) + 0.01), l1 + l2 - 0.001);
    const base = Math.atan2(dy, dx);
    let c = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
    c = Math.max(-1, Math.min(1, c));
    const a1 = base + (bend >= 0 ? 1 : -1) * Math.acos(c);
    const j = [root[0] + Math.cos(a1) * l1, root[1] + Math.sin(a1) * l1];
    const a2 = Math.atan2(tg[1] - j[1], tg[0] - j[0]);
    return [a1 / RAD, a2 / RAD];
  }

  function nLimb(x, leg) {
    if (Array.isArray(x)) return { fk: [x[0], x[1]], k: [1, 1], f: leg && x.length > 2 ? x[2] : null };
    const o = { k: x.k ? [x.k[0], x.k[1]] : [1, 1], f: x.f != null ? x.f : null, b: x.b != null ? x.b : (leg ? 1 : -1) };
    if (x.fk) o.fk = [x.fk[0], x.fk[1]];
    else for (const t of ['p', 'r', 's', 'hd']) if (x[t]) { o.ik = t; o.v = [x[t][0], x[t][1]]; break; }
    return o;
  }
  function fill(k, prev) {
    const o = Object.assign({}, prev || DEF, k);
    if (k.t != null && k.t2 == null) o.t2 = k.t;
    if ((k.t != null || k.t2 != null) && k.h == null) o.h = o.t2;
    return o;
  }
  function prepPose(k) {
    const P = { hip: k.hip.slice(), t: k.t, t2: k.t2, h: k.h, lift: k.lift || 0 };
    for (const s of LIMBS) P[s] = nLimb(k[s], s === 'l' || s === 'L');
    return P;
  }

  function joints(P, front) {
    const hip = [P.hip[0], P.hip[1] + (P.lift || 0)];
    const mid = mv(hip, P.t, L.T1), neck = mv(mid, P.t2, L.T2), shc = mv(mid, P.t2, L.SH), head = mv(neck, P.h, L.NK);
    const J = { hip, mid, neck, head, h: P.h, t2: P.t2, res: {}, seg: {}, front };
    const pu = dir(P.t2 + 90), ph = dir(P.t + 90);
    const ws = front ? L.WS : 0, wh = front ? L.WH : 0;
    const roots = {
      a: [shc[0] + pu[0] * ws, shc[1] + pu[1] * ws], A: [shc[0] - pu[0] * ws, shc[1] - pu[1] * ws],
      l: [hip[0] + ph[0] * wh, hip[1] + ph[1] * wh], L: [hip[0] - ph[0] * wh, hip[1] - ph[1] * wh]
    };
    for (const key of LIMBS) {
      const x = P[key], leg = key === 'l' || key === 'L';
      const l1 = (leg ? L.TH : L.UA) * x.k[0], l2 = (leg ? L.SN : L.FA) * x.k[1], root = roots[key];
      let a1, a2;
      if (x.fk) { a1 = x.fk[0]; a2 = x.fk[1]; }
      else {
        let tg;
        if (x.ik === 'p') tg = x.v;
        else if (x.ik === 'r') tg = [hip[0] + x.v[0], hip[1] + x.v[1]];
        else if (x.ik === 's') tg = [root[0] + x.v[0], root[1] + x.v[1]];
        else tg = [head[0] + x.v[0], head[1] + x.v[1]];
        [a1, a2] = ik(root, tg, l1, l2, x.b);
      }
      const j1 = mv(root, a1, l1), j2 = mv(j1, a2, l2);
      J.res[key] = [a1, a2];
      J.seg[key] = { root, a1, a2, l1: leg ? L.TH : L.UA, l2: leg ? L.SN : L.FA, k1: x.k[0], k2: x.k[1], fa: x.f != null };
      if (leg) {
        const f = x.f != null ? x.f : (front ? (key === 'l' ? a2 - 90 : a2 + 90) : a2 + 90);
        J.seg[key].f = f;
        J[key] = [root, j1, j2, mv(j2, f, front ? L.FT * 0.6 : L.FT)];
        J.res[key + 'f'] = f;
      } else J[key] = [root, j1, j2];
    }
    return J;
  }

  function blend(A, B, u) {
    const P = { hip: lerpV(A.hip, B.hip, u), t: lerpA(A.t, B.t, u), t2: lerpA(A.t2, B.t2, u), h: lerpA(A.h, B.h, u), lift: lerp(A.lift, B.lift, u) };
    for (const key of LIMBS) {
      const x = A[key], y = B[key];
      const o = { k: [lerp(x.k[0], y.k[0], u), lerp(x.k[1], y.k[1], u)], f: null };
      if (x.fk && y.fk) o.fk = [lerp(x.fk[0], y.fk[0], u), lerp(x.fk[1], y.fk[1], u)];
      else if (x.ik && y.ik && x.ik === y.ik) { o.ik = x.ik; o.v = lerpV(x.v, y.v, u); o.b = x.b; }
      else { const ra = A.R_[key], rb = B.R_[key]; o.fk = [lerpA(ra[0], rb[0], u), lerpA(ra[1], rb[1], u)]; }
      if ((key === 'l' || key === 'L') && (x.f != null || y.f != null)) o.f = lerpA(A.R_[key + 'f'], B.R_[key + 'f'], u);
      P[key] = o;
    }
    return P;
  }

  function prep(an) {
    if (an._k) return an;
    if (!an.fn) {
      let prev = null;
      an._k = an.k.map(k => { const f = fill(k, prev); prev = f; const P = prepPose(f); P.R_ = joints(P, an.front).res; return P; });
    } else an._k = [];
    // representative still: the keyframe furthest from the cycle's average pose
    if (an.thumb == null) {
      if (an.fn || an._k.length < 2) an.thumb = 0.3;
      else {
        const n = an._k.length, ts = an.ts || an._k.map((_, i) => i / n);
        const Js = ts.map(t => frameAt(an, t));
        const pts = J => [J.head, ...J.a.slice(1), ...J.A.slice(1), ...J.l.slice(1), ...J.L.slice(1)];
        const avg = pts(Js[0]).map((_, k) => [Js.reduce((t, J) => t + pts(J)[k][0], 0) / n, Js.reduce((t, J) => t + pts(J)[k][1], 0) / n]);
        let best = 0, bi = 0;
        Js.forEach((J, i) => { const d = pts(J).reduce((t, p, k) => t + (p[0] - avg[k][0]) ** 2 + (p[1] - avg[k][1]) ** 2, 0); if (d >= best - 1e-6) { best = d; bi = i; } });
        an.thumb = ts[bi];
      }
    }
    an._xfc = {};
    return an;
  }

  function frameAt(an, u) {
    let P;
    if (an.fn) { const k = fill(an.fn(u), null); P = prepPose(k); }
    else {
      const K = an._k, n = K.length;
      if (n === 1) P = K[0];
      else {
        const ts = an.ts || K.map((_, i) => i / n);
        let i = n - 1;
        for (let j = 0; j < n - 1; j++) if (u < ts[j + 1]) { i = j; break; }
        const t0 = ts[i], t1 = i < n - 1 ? ts[i + 1] : 1;
        let v = (u - t0) / (t1 - t0);
        v = an.ease === 'lin' ? v : ease(Math.max(0, Math.min(1, v)));
        P = blend(K[i], K[(i + 1) % n], v);
      }
    }
    return joints(P, an.front);
  }

  // ---------- 3D: lift the plane poses into a body with width, then view from any angle ----------
  // world axes: X forward (the way the body faces in side-view moves), Y up, Z sideways
  const V3 = {
    add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
    mul: (v, s) => [v[0] * s, v[1] * s, v[2] * s],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]
  };
  function lift(J, an) {
    const fr = !!an.front;
    const W = (x, y) => fr ? [0, y, -x] : [x, y, 0];
    const Q = { hip: W(...J.hip), mid: W(...J.mid), neck: W(...J.neck), head: W(...J.head) };
    for (const key of LIMBS) {
      const s = J.seg[key], leg = key === 'l' || key === 'L', near = key === 'A' || key === 'L';
      const r = W(...s.root);
      if (!fr) r[2] += (near ? 1 : -1) * (leg ? L.WH : 9.5);
      const outv = fr ? [1, 0, 0] : [0, 0, near ? 1 : -1];
      const step = (p, ang, len, k) => { const d = dir(ang); const m = Math.sqrt(Math.max(0, 1 - k * k)) * len; return V3.add(V3.add(p, W(d[0] * len * k, d[1] * len * k)), V3.mul(outv, m)); };
      let j1 = step(r, s.a1, s.l1, s.k1), j2 = step(j1, s.a2, s.l2, s.k2);
      if (!leg && !fr && an.hz != null) { const zc = r[2] * an.hz; j1 = [j1[0], j1[1], (r[2] + zc) / 2]; j2 = [j2[0], j2[1], zc]; }
      const pts = [r, j1, j2];
      if (leg) {
        let fd;
        if (fr && !s.fa) { const o = dir(s.f); fd = V3.add(V3.mul(W(o[0], o[1]), 0.35), [0.94, 0, 0]); }
        else { const o = dir(s.f); fd = W(o[0], o[1]); }
        pts.push(V3.add(j2, V3.mul(fd, L.FT)));
      }
      Q[key] = pts;
    }
    const hu = dir(J.h);
    Q.U = W(hu[0], hu[1]);
    Q.F = fr ? [1, 0, 0] : W(...dir(J.h - 90));
    Q.lat = fr ? W(...dir(J.t2 + 90)) : [0, 0, 1];
    Q.fwd = fr ? [1, 0, 0] : W(...dir(J.t2 - 90));
    // rest on the floor instead of sinking into it
    const rr = [[Q.hip, 8.8], [Q.mid, 9], [Q.neck, 9.6], [Q.head, 7.6], [Q.l[1], 4.5], [Q.L[1], 4.5], [Q.l[2], 3.3], [Q.L[2], 3.3], [Q.l[3], 2.7], [Q.L[3], 2.7], [Q.a[1], 3.3], [Q.A[1], 3.3], [Q.a[2], 2.9], [Q.A[2], 2.9]];
    let lo = 1e9; for (const [q, r] of rr) lo = Math.min(lo, q[1] - r);
    Q.dy = lo < -0.2 ? -lo - 0.2 : 0;
    if (Q.dy) { for (const k of ['hip', 'mid', 'neck', 'head']) Q[k] = [Q[k][0], Q[k][1] + Q.dy, Q[k][2]]; for (const k of LIMBS) Q[k] = Q[k].map(p => [p[0], p[1] + Q.dy, p[2]]); }
    Q.J = J;
    return Q;
  }
  // camera turned by phi degrees around the vertical axis (0 = side, 90 = front)
  function camera(phi, an) {
    const c = Math.cos(phi * RAD), s = Math.sin(phi * RAD), fr = !!an.front;
    const C = { c, s, fr };
    C.P = p => [p[0] * c - p[2] * s, p[1]];
    C.D = p => p[0] * s + p[2] * c;
    // props are authored in the move's own plane (x along the plane, y up) with a half-width w across it
    C.x = (x, w) => fr ? (w || 0) * c + x * s : x * c - (w || 0) * s;
    C.pt = (x, y, w) => [C.x(x, w), y];
    C.k = fr ? s : c;
    C.rx = (x0, x1, w) => { const xs = [C.x(x0, -w), C.x(x0, w), C.x(x1, -w), C.x(x1, w)]; return [Math.min(...xs), Math.max(...xs)]; };
    return C;
  }
  const VIEW = { side: 0, angle: 32, front: 90 };
  const defView = an => an.view || (an.front ? 'front' : 'angle');

  // ---------- props ----------
  const f1 = n => (Math.round(n * 10) / 10);
  const pt = p => f1(p[0]) + ',' + f1(p[1]);
  const mid2 = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const ln = (a, b, c, w) => `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" class="${c}" stroke-width="${w || 2.2}"/>`;
  const rc = (x, y, w, h, c, r) => `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(Math.max(0.6, w))}" height="${f1(h)}" rx="${r || 1}" class="${c}"/>`;
  const rx2 = (r, y0, y1, c, rad) => rc(r[0], y0, r[1] - r[0], y1 - y0, c, rad);
  const ci = (p, r, c, w) => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" class="${c}"${w ? ` stroke-width="${w}"` : ''}/>`;
  const el2 = (p, rx, ry, c, w) => `<ellipse cx="${f1(p[0])}" cy="${f1(p[1])}" rx="${f1(Math.max(0.4, Math.abs(rx)))}" ry="${ry}" class="${c}"${w ? ` stroke-width="${w}"` : ''}/>`;
  const dash = (C, u, sp, y, x0, x1, len) => { if (Math.abs(C.k) < 0.3) return ''; let s = ''; const gap = 22; const off = ((u * sp) % gap + gap) % gap; for (let x = x0 - gap + (gap - off); x < x1; x += gap) s += ln(C.pt(x, y), C.pt(x + len, y), 'pd', 1.6); return s; };
  const wrist = (J, k) => J[k][2];
  const ankle = (J, k) => J[k][2];
  const PROPS = {
    mat: { bx: (p, C) => C.rx(p.x0 || -50, p.x1 || 60, 13), draw: (J, u, p, C) => ({ b: rx2(C.rx(p.x0 || -50, p.x1 || 60, 13), -1.6, 0, 'pmat', 0.8) }) },
    wall: { bx: (p, C) => C.rx(p.x, p.x + 4, 30).concat([124]), draw: (J, u, p, C) => ({ b: rx2(C.rx(p.x, p.x + 4, 30), 0, 124, 'pwall', 0.5) }) },
    box: { bx: (p, C) => C.rx(p.x, p.x + p.w, 14), draw: (J, u, p, C) => ({ b: rx2(C.rx(p.x, p.x + p.w, 14), 0, p.h, 'pf', 1.5) }) },
    table: {
      bx: (p, C) => C.rx(p.x, p.x + p.w, 16),
      draw: (J, u, p, C) => { let s = ''; for (const x of [p.x + 3, p.x + p.w - 3]) for (const w of [-13, 13]) s += ln(C.pt(x, 0, w), C.pt(x, p.h - 3, w), 'ps', 2.2); return { b: s + rx2(C.rx(p.x, p.x + p.w, 16), p.h - 3, p.h, 'pf', 1) }; }
    },
    chair: {
      bx: (p, C) => C.rx(p.x - (p.w || 22) - 2, p.x + 2, 11),
      draw: (J, u, p, C) => {
        const w = p.w || 22, h = p.h || 21, x = p.x; let s = '';
        for (const lx of [x - 2, x - w + 2]) for (const z of [-9, 9]) s += ln(C.pt(lx, 0, z), C.pt(lx, h - 2, z), 'ps', 2.2);
        if (!p.noback) for (const z of [-9, 9]) s += ln(C.pt(x - w + 1.5, h, z), C.pt(x - w + 1.5, h + 30, z), 'ps', 2.2);
        s += rx2(C.rx(x - w, x, 11), h - 2.5, h, 'pf', 1);
        if (!p.noback) s += rx2(C.rx(x - w, x - w + 3, 11), h + 12, h + 30, 'pf', 1);
        return { b: s };
      }
    },
    db: { draw: (J, u, p) => { let s = ''; for (const k of p.one ? ['A'] : ['a', 'A']) { const w = wrist(J, k); s += ci(w, 4.2, 'pw') + ci(w, 1.4, 'pwc'); } return { f: s }; } },
    kb: { draw: (J, u, p) => { const w = mid2(wrist(J, 'a'), wrist(J, 'A')); const c = [w[0], w[1] - 6.5]; return { f: `<path d="M${f1(w[0] - 3.5)},${f1(w[1] - 2)} Q${f1(w[0])},${f1(w[1] + 3)} ${f1(w[0] + 3.5)},${f1(w[1] - 2)}" class="pwl" stroke-width="2"/>` + ci(c, 5.5, 'pw') }; } },
    gob: { draw: (J, u, p) => { const w = mid2(wrist(J, 'a'), wrist(J, 'A')); return { f: rc(w[0] - 2.5, w[1] - 7, 5, 14, 'pw', 1.5) + rc(w[0] - 4.5, w[1] + 4, 9, 3.5, 'pw', 1) + rc(w[0] - 4.5, w[1] - 7.5, 9, 3.5, 'pw', 1) }; } },
    band: {
      draw: (J, u, p, C) => {
        let s = '';
        if (p.to === 'hands') s = ln(wrist(J, 'a'), wrist(J, 'A'), 'pband', 1.8);
        else { const an = mid2(ankle(J, 'l'), ankle(J, 'L')); for (const k of ['a', 'A']) s += ln(wrist(J, k), [an[0] + (p.dx || 4) * C.k, an[1] + (p.dy || 0)], 'pband', 1.6); }
        return { b: s };
      }
    },
    bar: { bx: (p, C) => C.rx(1, 7, 26).concat([p.y + 6]), draw: (J, u, p, C) => { let s = ln(C.pt(4, p.y, -26), C.pt(4, p.y, 26), 'ps', 3); for (const z of [-26, 26]) s += ln(C.pt(4, p.y, z), C.pt(4, p.y + 8, z), 'ps', 3); return { b: s }; } },
    road: { draw: (J, u, p, C) => ({ b: dash(C, u, p.sp || 44, -5, -110, 110, 9) }) },
    tread: {
      bx: (p, C) => C.rx(-48, 46, 16).concat([66]),
      draw: (J, u, p, C) => {
        let s = rx2(C.rx(-46, 34, 15), -6, 0, 'pf', 3) + dash(C, u, p.sp || 44, -3, -42, 30, 7);
        for (const z of [-14, 14]) s += ln(C.pt(34, -3, z), C.pt(42, 62, z), 'ps', 3) + ln(C.pt(42, 62, z), C.pt(22, 58, z), 'ps', 2.4);
        s += ln(C.pt(42, 62, -14), C.pt(42, 62, 14), 'ps', 2.4) + rx2(C.rx(37, 45, 9), 59, 65, 'pf', 1.5);
        return { b: s };
      }
    },
    spin: {
      bx: (p, C) => C.rx(-32, 40, 13).concat([64]),
      draw: (J, u, p, C) => {
        const c = C.pt(0, 16), P = (x, y, w) => C.pt(x, y, w);
        let s = ln(P(-28, 1), P(36, 1), 'ps', 3) + ln(P(-24, 1, -12), P(-24, 1, 12), 'ps', 3) + ln(P(32, 1, -12), P(32, 1, 12), 'ps', 3)

  const elapsed = () => ((SES.paused || Date.now()) - SES.t0) / 1000;
  function nextExId(i) { for (let j = i + 1; j < SES.steps.length; j++) if (SES.steps[j].id) return SES.steps[j].id; return null; }
  function nextExStep(i) { for (let j = i + 1; j < SES.steps.length; j++) if (SES.steps[j].id) return SES.steps[j]; return null; }

  function startSession(plan, title) {
    SES = { key: plan.key, title: title || plan.title, steps: plan.steps.map(s => Object.assign({}, s)), N: stepsMeta(plan.steps), i: 0, t0: Date.now(), paused: null, done: 0, kc: 0, ids: [], str: false, cued: {}, started: Date.now(), seen: Date.now() };
    persistSes();
    openPlayer(true);
  }
  function openPlayer(fromClick) {
    closeSheet();
    const tt = $('#toast'); if (tt) tt.style.display = 'none';
    let box = $('#player');
    if (!box) { box = document.createElement('div'); box.id = 'player'; box.className = 'player'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'Workout player'); document.body.appendChild(box); }
    if (fromClick) { audioUnlock(); wakeOn(); }
    renderStep(); stepCue();
    clearInterval(TICK); TICK = setInterval(tick, 200);
  }
  function closePlayer() { clearInterval(TICK); TICK = 0; const b = $('#player'); if (b) b.remove(); FIGH = null; wakeOff(); keepAlive(); try { speechSynthesis.cancel(); } catch (e) { } document.title = 'Home Workout Coach'; render(); }
  function markDone(st, frac) {
    SES.done += st.s * frac; SES.kc += st.kc * frac;
    if (st.k === 'ex' && frac > 0.3) { if (!SES.ids.includes(st.id)) SES.ids.push(st.id); const g = EXM[st.id].g; if (g.some(x => ['push', 'pull', 'legs', 'glutes', 'core'].includes(x))) SES.str = true; }
  }
  function tick() {
    if (!SES || SES.fin) return;
    let changed = false, guard = 0;
    while (SES.i < SES.steps.length && elapsed() >= SES.steps[SES.i].s && guard++ < 600) {
      const st = SES.steps[SES.i]; markDone(st, 1); SES.t0 += st.s * 1000; SES.i++; changed = true;
    }
    if (SES.i >= SES.steps.length) return finish();
    if (changed) { renderStep(); stepCue(); persistSes(); }
    update(); cues();
    if (Date.now() - lastPersist > 4000) { SES.seen = Date.now(); persistSes(); lastPersist = Date.now(); }
  }
  function segAt(st, t) { let a = 0; for (let i = 0; i < st.segs.length; i++) { if (t < a + st.segs[i].s) return { i, left: a + st.segs[i].s - t, start: a }; a += st.segs[i].s; } return { i: st.segs.length - 1, left: 0, start: a }; }
  function stepCue() {
    const st = SES.steps[SES.i], nx = nextExStep(SES.i);
    media(); keepAlive();
    if (SES.cued['s' + SES.i]) return; SES.cued['s' + SES.i] = 1;
    if (st.k === 'ex') { beep(1046, 0.35); buzz(200); say(EXM[st.id].n + (EXM[st.id].side ? '. Start with your left side.' : '')); }
    else if (st.k === 'steady') { beep(1046, 0.35); buzz([200, 100, 200]); say(`${EXM[st.id].n}. ${Math.round(st.s / 60)} minutes. Start with ${st.segs[0].lab.toLowerCase()}.`); }
    else if (st.k === 'prep') say('Get ready. First up: ' + (nx ? EXM[nx.id].n : ''));
    else if (st.k === 'rest' || st.k === 'tr') { beep(660, 0.2); if (nx) say((st.k === 'rest' ? 'Rest. ' : '') + 'Next: ' + EXM[nx.id].n); }
  }
  function cues() {
    const st = SES.steps[SES.i], t = elapsed(), left = st.s - t, c = SES.cued, i = SES.i;
    if (SES.paused) return;
    const sec = Math.ceil(left);
    if (sec <= 3 && sec >= 1 && st.s > 5 && !c[i + 'b' + sec]) { c[i + 'b' + sec] = 1; beep(880, 0.12, 0.3); }
    if (st.k === 'ex' && EXM[st.id].side && t >= st.s / 2 && !c[i + 'sw']) { c[i + 'sw'] = 1; beep(988, 0.25); buzz(150); say('Switch sides'); }
    if (st.k === 'steady') {
      const g = segAt(st, t);
      if (g.i > 0 && !c[i + 'g' + g.i]) { c[i + 'g' + g.i] = 1; beep(988, 0.2); setTimeout(() => beep(1175, 0.25), 260); buzz([150, 80, 150]); const sg = st.segs[g.i]; say(`${sg.lab} for ${sg.s >= 60 ? Math.round(sg.s / 60) + ' minute' + (sg.s >= 120 ? 's' : '') : sg.s + ' seconds'}`); }
      if (EXM[st.id].out && t >= st.s / 2 && !c[i + 'half']) { c[i + 'half'] = 1; beep(784, 0.3); buzz([300, 100, 300]); say('Halfway. If you are out and back, turn around now.'); }
      if (left <= 10 && left > 9 && !c[i + 'ten']) { c[i + 'ten'] = 1; say('Ten seconds'); }
    }
  }
  function renderStep() {
    const box = $('#player'); if (!box || !SES) return;
    const st = SES.steps[SES.i], nx = nextExStep(SES.i);
    const showId = st.id || (nx && nx.id);
    const e = showId ? EXM[showId] : null;
    box.className = 'player ' + (st.k === 'ex' ? 'work' : st.k);
    let phase = '', title = '', sub = '';
    if (st.k === 'ex') { phase = (st.blk || '') + (st.R > 1 ? ` · round ${st.r} of ${st.R}` : ''); title = e.n; }
    else if (st.k === 'steady') { phase = 'Cardio'; title = e.n; }
    else if (st.k === 'prep') { phase = 'Get ready'; title = 'Get ready'; sub = nx ? 'First: ' + EXM[nx.id].n : ''; }
    else { phase = st.big ? 'Round break' : st.k === 'tr' ? 'Next up' : 'Rest'; title = st.k === 'tr' ? (nx ? EXM[nx.id].n : 'Next') : (st.big ? 'Round break' : 'Rest'); sub = nx && st.k !== 'tr' ? 'Next: ' + EXM[nx.id].n : ''; }
    const after = st.k === 'ex' || st.k === 'steady' ? nx : null;
    let extra = '';
    if (st.k === 'steady') extra = `<div class="segs" id="segs">${st.segs.map((g, j) => `<div data-j="${j}" hidden><span>${esc(g.lab)}</span><span class="num">${mmss(g.s)}</span></div>`).join('')}</div><div class="pnote">${e.out ? 'Lock your phone or switch apps and the timer keeps time. Cues for each change and the halfway turn play in the background if your browser allows it.' : 'Switch apps if you like: the timer keeps time.'}</div>`;
    else if (e && (st.k === 'ex')) extra = `<details class="howbox"><summary>How to do it</summary><ol class="steps" style="margin-top:6px">${e.how.map(x => `<li>${esc(x)}</li>`).join('')}</ol><div style="margin-top:6px"><b>Tip:</b> ${esc(e.cue)}</div></details>`;
    box.innerHTML = `<div class="pwrap">
      <div class="ptop"><button class="iconbtn" data-act="pclose" aria-label="End workout">${ic('close')}</button><div class="pphase">${esc(phase)}${st.n ? ` <span class="num">· ${st.n}/${SES.N}</span>` : ''}</div><button class="iconbtn" data-act="psound" aria-label="${muted() ? 'Turn sound on' : 'Turn sound off'}">${ic(muted() ? 'mute' : 'sound')}</button></div>
      <div class="pstage" id="pstage">${st.k !== 'ex' && st.k !== 'steady' && e ? '<span class="badge">Next</span>' : ''}</div>
      ${e ? `<div class="row between pcam"><span class="small" style="color:inherit;opacity:.85">Camera</span>${viewSeg(e, true)}</div>` : ''}
      <div><div class="ptitle">${esc(title)}</div><div class="psub" id="psub">${esc(sub)}</div></div>
      <div class="row between" style="align-items:flex-end"><div class="ptime" id="ptime">0:00</div>${st.k === 'ex' || st.k === 'rest' || st.k === 'tr' ? `<button class="btn sm" data-act="pplus" style="background:rgba(255,255,255,.2);color:inherit">+15 s</button>` : ''}</div>
      <div class="pbar"><i id="pbar"></i></div>
      ${extra}
      ${after ? `<div class="pnext">${th(after.id)}<span>Then <b>${esc(EXM[after.id].n)}</b></span></div>` : ''}
      <div class="pctl"><button data-act="pprev" aria-label="Previous">${ic('prev')}</button><button class="main" data-act="ppause" id="ppause" aria-label="${SES.paused ? 'Resume' : 'Pause'}">${ic(SES.paused ? 'play' : 'pause')}</button><button data-act="pnext" aria-label="Skip">${ic('next')}</button></div>
    </div>`;
    fillThumbs(box);
    FIGH = null;
    if (e) {
      FIGH = FIG.build(e, { view: VIEWPREF[e.id] || 'auto' }); $('#pstage').appendChild(FIGH.svg);
      if (st.k === 'ex' || st.k === 'steady') { FIG.syncTo(FIGH, SES.t0); FIG.play(FIGH); if (SES.paused) FIGH.paused = true; }
      else { FIGH.speed = 1; FIG.play(FIGH); }
    }
    update();
  }
  function update() {
    if (!SES || SES.fin) return;
    const st = SES.steps[SES.i], t = elapsed(), left = Math.max(0, st.s - t);
    const tm = $('#ptime'); if (!tm) return;
    tm.textContent = mmss(left);
    $('#pbar').style.width = clamp(t / st.s * 100, 0, 100).toFixed(1) + '%';
    const sub = $('#psub');
    if (st.k === 'ex') {
      const e = EXM[st.id];
      let s = '';
      if (e.side) s = t < st.s / 2 ? 'Left side' : 'Right side';
      if (!e.hold) { const tot = Math.max(1, Math.floor(st.s / e.an.dur)); const rep = Math.min(tot, Math.floor(t / e.an.dur) + 1); s = (s ? s + ' · ' : '') + `Rep ${rep} of ~${tot}`; }
      else s = (s ? s + ' · ' : '') + 'Hold steady, keep breathing';
      if (sub.textContent !== s) sub.textContent = s;
    } else if (st.k === 'steady') {
      const g = segAt(st, t), sg = st.segs[g.i];
      const s = `${sg.lab}: ${mmss(g.left)} left`;
      if (sub.textContent !== s) sub.textContent = s;
      const lo = Math.max(0, Math.min(g.i - 1, st.segs.length - 4));
      for (const d of $$('#segs div')) { const j = +d.dataset.j; d.className = j === g.i ? 'on' : j < g.i ? 'past' : ''; d.hidden = j < lo || j > lo + 3; }
    }
    const nm = st.k === 'ex' || st.k === 'steady' ? EXM[st.id].n : 'Rest';
    document.title = mmss(left) + ' · ' + nm;
  }
  function togglePause() {
    if (!SES) return;
    if (SES.paused) { SES.t0 += Date.now() - SES.paused; SES.paused = null; wakeOn(); if (FIGH) { FIG.syncTo(FIGH, SES.t0); FIGH.paused = false; } }
    else { SES.paused = Date.now(); if (FIGH && SES.steps[SES.i].id) FIGH.paused = true; try { speechSynthesis.cancel(); } catch (e) { } }
    persistSes(); keepAlive();
    const b = $('#ppause'); if (b) { b.innerHTML = ic(SES.paused ? 'play' : 'pause'); b.setAttribute('aria-label', SES.paused ? 'Resume' : 'Pause'); }
  }
  function skip(dir) {
    if (!SES || SES.fin) return;
    const st = SES.steps[SES.i], t = elapsed();
    if (dir > 0) { markDone(st, clamp(t / st.s, 0, 1)); SES.i++; }
    else { if (t > 3 || SES.i === 0) { /* restart current */ } else { SES.i--; } }
    const now = Date.now(); SES.t0 = now; if (SES.paused) SES.paused = now;
    if (SES.i >= SES.steps.length) return finish();
    delete SES.cued['s' + SES.i];
    for (const k of Object.keys(SES.cued)) if (k.startsWith(SES.i + '')) delete SES.cued[k];
    renderStep(); stepCue(); persistSes();
  }
  function plus15() { const st = SES.steps[SES.i]; st.s += 15; for (const k of Object.keys(SES.cued)) if (k.startsWith(SES.i + 'b')) delete SES.cued[k]; update(); persistSes(); }
  function finish() {
    if (!SES) return;
    clearInterval(TICK); TICK = 0;
    SES.fin = true;
    const mins = Math.round(SES.done / 60), kcal = Math.round(SES.kc);
    let entry = null;
    if (SES.done >= 60) {
      entry = { d: SES.key, ts: Date.now(), mins, kcal, title: SES.title, ids: SES.ids.slice(0, 40), str: SES.str, feel: '' };
      LOG.workouts.push(entry); saveAll();
    }
    persistSes(); keepAlive(); wakeOff();
    try { speechSynthesis.cancel(); } catch (e) { }
    beep(1318, 0.5); buzz([200, 100, 200, 100, 400]); say(entry ? 'Workout complete. Great job.' : 'Stopped.');
    const box = $('#player'); if (!box) return;
    box.className = 'player done';
    document.title = 'Home Workout Coach';
    box.innerHTML = `<div class="pwrap" style="gap:16px"><div class="ptop"><span></span><button class="iconbtn" data-act="pdone" aria-label="Close">${ic('close')}</button></div>
      <div><div class="eyebrow">${entry ? 'Workout complete' : 'Workout stopped'}</div><h1 class="display" style="font-size:56px">${entry ? 'Well done' : 'No problem'}</h1></div>
      <div class="stats"><div class="stat"><b>${mins}</b><span>minutes</span></div><div class="stat"><b>≈${kcal}</b><span>kcal</span></div><div class="stat"><b>${SES.ids.length}</b><span>moves</span></div></div>
      ${entry ? `<div class="card"><b>How did it feel?</b><span class="small">Your next workouts adjust work and rest times to match.</span><div class="row wrap"><button class="btn" data-act="feel" data-v="easy">Too easy</button><button class="btn" data-act="feel" data-v="right">Just right</button><button class="btn" data-act="feel" data-v="hard">Too hard</button></div></div>` : '<p class="muted" style="margin:0">Less than a minute was done, so nothing was logged.</p>'}
      <button class="btn primary big" data-act="pdone">Done</button></div>`;
  }
  function feel(v) {
    const last = LOG.workouts[LOG.workouts.length - 1];
    if (last) last.feel = v === 'easy' ? 'easy' : v === 'hard' ? 'hard' : 'just right';
    if (P) {
      if (v === 'easy') P.adapt = clamp((P.adapt || 0) + 1, -2, 3);
      if (v === 'hard') P.adapt = clamp((P.adapt || 0) - 1, -2, 3);
    }
    saveAll();
    let msg = v === 'easy' ? 'Next time: longer work, shorter rest.' : v === 'hard' ? 'Next time: shorter work, more rest.' : 'Keeping things as they are.';
    if (P && v === 'easy' && P.adapt >= 3 && P.level < 3) msg = 'You’ve outgrown this level. Try Intermediate in Profile.';
    SES = null; persistSes(); closePlayer(); toast(msg);
  }
  async function askClose() {
    if (!SES || SES.fin) return closePlayer();
    const wasPaused = !!SES.paused; if (!wasPaused) togglePause();
    const r = await confirmBox('End this workout?', 'You can save what you’ve done so far or discard it.', [['Keep going', 'keep', 'primary'], ['Save and end', 'save'], ['Discard', 'discard', 'ghost']]);
    if (r === 'save') { const st = SES.steps[SES.i]; markDone(st, clamp(elapsed() / st.s, 0, 1)); finish(); }
    else if (r === 'discard') { SES = null; persistSes(); closePlayer(); }
    else if (!wasPaused) togglePause();
  }
  function tryEx(id) {
    const e = EXM[id], p = prof();
    const s = e.g.includes('steady') ? 300 : e.side ? 60 : 40;
    const steps = [{ k: 'prep', s: 5 }, e.g.includes('steady') ? { k: 'steady', id, s, segs: segsFor(id, s, p) } : { k: 'ex', id, s, blk: 'Follow along' }];
    for (const x of steps) { x.kc = kcalStep(x, p.weight); }
    steps[1].n = 1;
    startSession({ key: dkey(new Date()), steps, title: e.n }, e.n);
  }

  // ---------- events ----------
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act, now = new Date(), key = dkey(now);
    switch (a) {
      case 'tab': go(b.dataset.tab); break;
      case 'ex': openEx(b.dataset.id); break;
      case 'close': closeSheet(); break;
      case 'speed': { for (const c of $$('[data-act="speed"]')) c.setAttribute('aria-pressed', c === b); const sh = $('.scrim'); if (sh && sh._fig) { const f = sh._fig, n = performance.now(), v = +b.dataset.v; const el2 = (n - f.t0) / 1000 * f.speed; f.speed = v; f.t0 = n - el2 / v * 1000; } break; }
      case 'try': closeSheet(); tryEx(b.dataset.id); break;
      case 'view': setViewPref(b); break;
      case 'g-start': case 'g-signin': case 'g-guest': case 'g-google': case 'g-create': case 'g-reset': gateAction(a); break;
      case 'signin': showGate('auth'); break;
      case 'signout': signOut(); break;
      case 'start': { const plan = planFor(now, true); startSession(plan); break; }
      case 'startday': { const d = fromKey(b.dataset.key); const plan = planFor(d, true); plan.key = key; startSession(plan); break; }
      case 'resume': if (SES) openPlayer(true); break;
      case 'discard': SES = null; persistSes(); render(); break;
      case 'mins': ovFor(key).mins = +b.dataset.v; saveOV(); render(); break;
      case 'shuffle': { const o = ovFor(key); o.seed = (o.seed || 0) + 1; delete o.swaps; delete o.tried; saveOV(); render(); toast('New mix of exercises'); break; }
      case 'resetday': delete OV[key]; saveOV(); render(); break;
      case 'force': ovFor(key).force = true; saveOV(); render(); break;
      case 'restmob': Object.assign(ovFor(key), { force: true, focus: 'mobility', mins: 10 }); saveOV(); render(); break;
      case 'swap': swapItem(b.dataset.key); break;
      case 'swapsteady': swapSteady(); break;
      case 'day': openDay(b.dataset.key); break;
      case 'libcat': libCat = b.dataset.v; for (const c of $$('[data-act="libcat"]')) c.setAttribute('aria-pressed', c === b); $('#liblist').innerHTML = libList(); fillThumbs($('#liblist')); break;
      case 'dchip': dchip(b); break;
      case 'wipe': confirmBox('Erase all your data?', 'This removes your profile, weight log and workout history from this app.', [['Cancel', null, 'primary'], ['Erase', 'yes', 'ghost']]).then(r => { if (r !== 'yes') return; P = null; LOG = { workouts: [], weights: [] }; OV = {}; SES = null; saveOV(); persistSes(); saveAll(); LS.set('welcomed', false); go('today'); toast('Your data was erased'); }); break;
      case 'pclose': askClose(); break;
      case 'psound': { const p = P || null; if (P) P.sound = !P.sound; else EXAMPLE.sound = !EXAMPLE.sound; if (P) saveAll(); if (muted()) { try { speechSynthesis.cancel(); } catch (x) { } } keepAlive(); b.innerHTML = ic(muted() ? 'mute' : 'sound'); b.setAttribute('aria-label', muted() ? 'Turn sound on' : 'Turn sound off'); break; }
      case 'ppause': togglePause(); break;
      case 'pnext': skip(1); break;
      case 'pprev': skip(-1); break;
      case 'pplus': plus15(); break;
      case 'feel': feel(b.dataset.v); break;
      case 'pdone': SES = null; persistSes(); closePlayer(); break;
    }
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest('[data-form]'); if (!f) return;
    e.preventDefault();
    if (f.dataset.form === 'profile') submitProfile();
    if (f.dataset.form === 'g-email') gateAction('g-email');
    if (f.dataset.form === 'weight') {
      const v = Math.round(parseFloat($('#wkg').value) * 10) / 10;
      if (!(v >= 30 && v <= 300)) { $('#werr').textContent = 'Enter a weight between 30 and 300 kg.'; return; }
      if (!P) P = JSON.parse(JSON.stringify(EXAMPLE));
      addWeight(v); saveAll(); render(); toast('Weight saved');
    }
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'libq') { libQ = e.target.value; $('#liblist').innerHTML = libList(); fillThumbs($('#liblist')); }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'libfit') { libFit = e.target.checked; $('#liblist').innerHTML = libList(); fillThumbs($('#liblist')); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('.scrim')) closeSheet(); } });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && SES && !SES.fin && $('#player')) { tick(); if (!SES.paused) wakeOn(); }
  });
  window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (VIEWS[t] && t !== TAB) go(t); });

  // ---------- boot ----------
  function boot() {
    document.getElementById('app').innerHTML = `<main id="main" tabindex="-1"></main><nav class="tabs" aria-label="Sections">${TABS.map(([k, n, i]) => `<button data-act="tab" data-tab="${k}">${ic(i)}<span>${n}</span></button>`).join('')}</nav>`;
    const h = location.hash.slice(1);
    if (VIEWS[h]) TAB = h;
    if (SES && !SES.fin) {
      if (Date.now() - (SES.seen || SES.started) > 30 * 60000 && !SES.paused) SES.paused = SES.seen || SES.started;
      if (Date.now() - SES.started > 6 * 3600000) SES = null;
      persistSes();
    } else if (SES && SES.fin) { SES = null; persistSes(); }
    render();
    if (needGate()) showGate('welcome');
    setTimeout(cloudInit, 0);
    if (window.HWC_HOSTED && 'serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { } }
  }
  if (location.protocol === 'file:') window.HWC = { planFor, EX, allowed, setProfile: p => { P = p; render(); } };
  boot();
})();

</script>
